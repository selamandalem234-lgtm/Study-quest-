<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Study Quest — Multiplayer Bean World & Grade 10 Companion</title>
<meta name="description" content="Premium multiplayer study game with customizable Bean companion, floating sky islands, crop farming, friends visits, Pomodoro focus timers, and Grade 10 textbook revision.">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f8fafc;
  --surface: rgba(255, 255, 255, 0.85);
  --surface-solid: #ffffff;
  --border: rgba(226, 232, 240, 0.85);
  --border-focus: #007aff;
  --text: #0f172a;
  --text-muted: #64748b;
  --blue: #007aff;
  --blue-hover: #0062cc;
  --orange: #ff9500;
  --green: #34c759;
  --red: #ff3b30;
  --yellow: #facc15;
  --ink: #0f172a;
  --font: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #000000;
    --surface: rgba(28, 28, 30, 0.8);
    --surface-solid: #1c1c1e;
    --border: rgba(255, 255, 255, 0.1);
    --border-focus: #0a84ff;
    --text: #f8fafc;
    --text-muted: #94a3b8;
    --blue: #0a84ff;
    --blue-hover: #409cff;
    --orange: #ff9f0a;
    --green: #30d158;
    --red: #ff453a;
    --yellow: #ffd60a;
    --ink: #ffffff;
  }
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 15px/1.45 var(--font);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3, h4, p { margin: 0; }
:focus-visible { outline: 2.5px solid var(--border-focus); outline-offset: 2px; }

/* Layout & Containers */
#app {
  max-width: 820px;
  width: 100%;
  margin: 0 auto;
  padding: 16px 16px 90px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.glass-card {
  background: var(--surface);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--border);
  border-radius: 24px;
  padding: 20px 24px;
  box-shadow: 0 4px 24px -2px rgba(0, 0, 0, 0.04);
}

/* Top App Bar */
.top-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 8px 4px 4px;
  flex-wrap: wrap;
}
.brand-group { display: flex; align-items: center; gap: 10px; }
.brand-icon {
  width: 36px; height: 36px;
  border-radius: 12px;
  background: var(--blue);
  color: #fff;
  display: grid; place-items: center;
  font-weight: 800; font-size: 15px;
  box-shadow: 0 4px 12px rgba(0, 122, 255, 0.25);
}
.top-bar h1 { font-size: 1.35rem; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; }
.subline { color: var(--text-muted); font-size: 0.8rem; margin-top: 1px; font-weight: 500; }
.chips { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 12px; border-radius: 999px;
  font-weight: 700; font-size: 0.82rem;
  background: var(--surface); border: 1px solid var(--border);
}
.chip.flame { background: rgba(255, 149, 0, 0.12); border-color: rgba(255, 149, 0, 0.3); color: var(--orange); }
.chip.cold { color: var(--text-muted); }

/* Buttons */
.btn {
  min-height: 44px; padding: 10px 18px;
  border-radius: 16px; border: 1px solid var(--border);
  background: var(--surface-solid); color: var(--text);
  font-weight: 700; font-size: 0.88rem;
  cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  transition: all 0.15s ease;
}
.btn:hover { border-color: var(--text); }
.btn:active { transform: scale(0.97); }
.btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; box-shadow: 0 4px 14px rgba(0, 122, 255, 0.25); }
.btn.primary:hover { background: var(--blue-hover); }
.btn.sm { min-height: 36px; padding: 6px 12px; font-size: 0.8rem; border-radius: 12px; }
.btn.danger { color: var(--red); }
.go {
  width: 100%; min-height: 52px; padding: 14px 20px;
  background: var(--blue); color: #fff;
  border: 0; border-radius: 18px;
  font-weight: 800; font-size: 1.05rem;
  cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
  box-shadow: 0 6px 20px rgba(0, 122, 255, 0.3);
  transition: all 0.15s ease;
}
.go:hover { background: var(--blue-hover); }
.go:active { transform: scale(0.98); }
.link { background: none; border: 0; color: var(--blue); font-weight: 600; cursor: pointer; padding: 6px; text-decoration: none; }
.link:hover { text-decoration: underline; }

/* Dashboard Rings & Today Grid */
.dashboard-grid {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 20px;
  align-items: center;
}
@media (max-width: 600px) {
  .dashboard-grid { grid-template-columns: 1fr; justify-items: center; text-align: center; }
}

.numline { display: flex; align-items: baseline; gap: 8px; }
.num { font-size: 2.2rem; font-weight: 800; font-variant-numeric: tabular-nums; }
.pill {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 10px; border-radius: 99px; font-weight: 700; font-size: 0.78rem;
}
.pill.ok { background: rgba(52, 199, 89, 0.15); color: var(--green); }
.pill.bad { background: rgba(255, 59, 48, 0.15); color: var(--red); }

/* Progress Strips */
.strip {
  height: 10px; background: rgba(0, 0, 0, 0.06);
  border-radius: 99px; overflow: hidden; margin: 10px 0;
}
@media (prefers-color-scheme: dark) { .strip { background: rgba(255, 255, 255, 0.1); } }
.strip i { display: block; height: 100%; background: var(--blue); border-radius: 99px; transition: width 0.4s ease; }
.strip.xp i { background: var(--yellow); }
.strip.green i { background: var(--green); }

/* Weekly Bar Chart */
.chart-wrap { position: relative; margin: 14px 0 6px; --h: 130px; }
.chart { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.col {
  display: grid; grid-template-rows: var(--h) 24px;
  justify-items: center; border-radius: 8px;
}
.col .plot {
  display: flex; flex-direction: column; justify-content: flex-end; align-items: center;
  width: 100%; border-bottom: 1.5px solid var(--border);
}
.col .val { font-size: 0.75rem; font-weight: 800; height: 18px; line-height: 18px; color: var(--text-muted); }
.col i { display: block; width: min(70%, 36px); background: rgba(0, 122, 255, 0.35); border-radius: 6px 6px 0 0; }
.col.today i { background: var(--blue); }
.col b { font-size: 0.75rem; font-weight: 600; color: var(--text-muted); align-self: center; }
.col.today b { color: var(--text); font-weight: 800; }

/* Subject Cards */
.subj-card {
  display: flex; flex-direction: column; gap: 12px;
  padding: 16px 20px; border-radius: 20px;
  background: var(--surface); border: 1px solid var(--border);
  margin-bottom: 10px;
}
.subj-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.subj-title { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.05rem; }
.subj-acts { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin-top: 4px; }

/* Badges Grid */
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
.badge {
  padding: 12px; border-radius: 18px;
  background: var(--surface); border: 1px solid var(--border);
  text-align: center; opacity: 0.45; filter: grayscale(1);
}
.badge.on { opacity: 1; filter: none; border-color: var(--yellow); background: rgba(250, 204, 21, 0.08); }
.badge .e { font-size: 2rem; display: block; margin-bottom: 4px; }
.badge b { font-size: 0.82rem; display: block; }
.badge span.d { font-size: 0.72rem; color: var(--text-muted); margin-top: 2px; display: block; }

/* Bean Animations & Companion */
.bean-wrap { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.bean { width: 120px; height: 115px; overflow: visible; }
.bf .pk, .bf .pa, .bf .pt, .bf .e-h, .bf .e-s, .bf .e-z, .bf .mo-h, .bf .mo-s, .bf .mo-z, .bf .zz { display: none; }
.bf.p-knit .pk, .bf.p-arms .pa, .bf.p-tea .pt, .bf.m-happy .e-h, .bf.m-happy .mo-h, .bf.m-sad .e-s, .bf.m-sad .mo-s, .bf.m-sleep .e-z, .bf.m-sleep .mo-z, .bf.m-sleep .zz { display: inline; }
.bf-eyes { transform-box: fill-box; transform-origin: center; animation: blink 4.6s infinite; }
.bf.m-sad .bf-body { transform: scale(1.03,.94); transform-box: fill-box; transform-origin: 50% 100%; }
.bf .nl, .bf .nr { transform-box: fill-box; transform-origin: 50% 100%; }
.bf.knitting .nl { animation: needle .5s ease-in-out infinite alternate; }
.bf.knitting .nr { animation: needle .5s ease-in-out infinite alternate-reverse; }
.bf .sock { transform-box: fill-box; transform-origin: 50% 0; }
.bf.knitting .sock { animation: sockgrow 14s ease-out infinite; }
.bf .zz { font: 800 16px var(--font); fill: var(--blue); animation: zfloat 2.6s ease-in infinite; }
.bf .st { animation: steam 2.4s ease-out infinite; opacity: 0; }
.bean.knit .bf-all, .bean.tea .bf-all { animation: beanbob 2.4s ease-in-out infinite; }
.bean.sleep .bf-all { animation: breathe 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }

@keyframes blink { 0%,94%,100%{transform:scaleY(1)} 97%{transform:scaleY(.1)} }
@keyframes needle { from{transform:rotate(-9deg)} to{transform:rotate(9deg)} }
@keyframes sockgrow { 0%{transform:scaleY(.25)} 100%{transform:scaleY(1)} }
@keyframes beanbob { 50%{transform:translateY(-4px)} }
@keyframes breathe { 50%{transform:scale(1.025,.97)} }
@keyframes zfloat { 0%{transform:translate(0,6px);opacity:0} 30%{opacity:1} 100%{transform:translate(8px,-14px);opacity:0} }
@keyframes steam { 0%{transform:translateY(4px);opacity:0} 30%{opacity:.8} 100%{transform:translateY(-12px);opacity:0} }

/* Bean's World SVG & Animations */
.world-wrap { overflow-x: auto; overflow-y: hidden; border-radius: 24px; border: 1px solid var(--border); background: #9fd8ff; -webkit-overflow-scrolling: touch; }
.w-svg { display: block; width: 1600px; height: 300px; }
.w-svg .wsway { animation: wsway 5s ease-in-out infinite; }
.w-svg .cloud { animation: cloudrun var(--d, 100s) linear infinite; }
.w-svg .rays { animation: spin 50s linear infinite; transform-origin: 110px 66px; }
.w-svg .halo { animation: halo 5s ease-in-out infinite; transform-origin: 110px 66px; }
.w-svg .tint { animation: golden 120s linear infinite; }
.w-svg .night { opacity: 0; animation: nightk 120s linear infinite; }
.w-svg .stars, .w-svg .moonb, .w-svg .lights, .w-svg .flies { opacity: 0; animation: litk 120s linear infinite; }
.w-svg .sunb { animation: sunk 120s linear infinite; }
.w-svg .star { animation: twinkle 2.6s ease-in-out infinite; }
.w-svg .rainc { opacity: 0; animation: rainck 100s linear infinite; }
.w-svg .rainc line { animation: raink .8s linear infinite; }
.w-svg .rb { opacity: 0; animation: rbk 100s linear infinite; }
.w-svg .rip { opacity: 0; animation: ripple 3.2s ease-out infinite; transform-box: fill-box; transform-origin: center; }
.w-svg .frog { animation: frogk 10s ease-in-out infinite; }
.w-svg .blades { animation: spin 9s linear infinite; }
.w-svg .swing { animation: swingk 3.4s ease-in-out infinite; }
.w-svg .sm { animation: smoke 4.5s ease-out infinite; opacity: 0; transform-box: fill-box; transform-origin: center; }
.w-svg .win { animation: winglow 3s ease-in-out infinite alternate; }
.w-svg .flame { animation: flame .35s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 50% 100%; }
.w-svg .glow { animation: winglow .5s ease-in-out infinite alternate; }
.w-svg .wob { animation: wob 2.6s ease-in-out infinite; }
.w-svg .wl, .w-svg .wr { animation: wing .16s ease-in-out infinite alternate; transform-box: fill-box; }
.w-svg .wl { transform-origin: 100% 50%; } .w-svg .wr { transform-origin: 0 50%; }
.w-svg .bfly { animation: flutter 22s ease-in-out infinite; }
.w-svg .bird { animation: fly var(--d, 32s) linear infinite; }
.w-svg .bw { animation: flap .3s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 100% 100%; }
.w-svg .bw2 { transform-origin: 0 100%; }
.w-svg .spot { cursor: pointer; outline: none; }
.w-svg .spot.locked .art { opacity: .28; filter: grayscale(1); }
.w-svg .spot.owned .tag { display: none; }
.w-svg .spot:focus-visible .art { filter: drop-shadow(0 0 6px var(--blue)); }
.w-svg .tag { animation: tagbob 2s ease-in-out infinite; }
.w-svg .spot.can .tag rect { fill: var(--yellow); }
.w-svg .cat { cursor: pointer; }
.w-svg .cat .breath { animation: breathe 3.4s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
.w-svg .cat .tail { animation: tail 3s ease-in-out infinite; transform-box: fill-box; transform-origin: 0 100%; }
.w-svg .cat.purr .tail { animation-duration: .35s; }
.w-svg .cat text { font: 800 14px var(--font); fill: #6b7aa8; animation: zfloat 3s ease-in infinite; }
.w-svg .snail { animation: crawl 260s linear infinite; animation-delay: -70s; }
.w-svg .stalk { animation: stalk 2s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 50% 100%; }
.w-svg .bun { animation: bunrun 50s linear infinite; }
.w-svg .bh { animation: bunhop .5s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
.w-svg .seed { animation: seedk 16s linear infinite; }
.w-svg .puff { animation: puff .7s ease-out forwards; transform-box: fill-box; transform-origin: center; }
.w-svg .burst text { font-size: 18px; animation: burst .9s ease-out forwards; }
.w-svg .say { opacity: 0; transition: opacity .25s; pointer-events: none; }
.w-svg .say.on { opacity: 1; }

@keyframes wsway { 0%,100%{transform:rotate(-1.6deg)} 50%{transform:rotate(1.6deg)} }
@keyframes cloudrun { from{transform:translateX(-320px)} to{transform:translateX(1900px)} }
@keyframes spin { to{transform:rotate(360deg)} }
@keyframes halo { 50%{opacity:.55;transform:scale(1.12)} }
@keyframes golden { 0%,34%{opacity:0} 50%{opacity:.3} 62%{opacity:0} 94%{opacity:0} 97%{opacity:.18} 100%{opacity:0} }
@keyframes nightk { 0%,56%{opacity:0} 70%,90%{opacity:.55} 100%{opacity:0} }
@keyframes litk { 0%,58%{opacity:0} 70%,90%{opacity:1} 100%{opacity:0} }
@keyframes sunk { 0%,52%{opacity:1} 64%,92%{opacity:0} 100%{opacity:1} }
@keyframes twinkle { 50%{opacity:.3} }
@keyframes rainck { 0%,40%{opacity:0} 44%,52%{opacity:1} 57%,100%{opacity:0} }
@keyframes rbk { 0%,50%{opacity:0} 57%,68%{opacity:.75} 78%,100%{opacity:0} }
@keyframes raink { from{transform:translate(0,-16px)} to{transform:translate(-26px,300px)} }
@keyframes ripple { 0%{transform:scale(.3);opacity:.9} 100%{transform:scale(2.4);opacity:0} }
@keyframes frogk { 0%,40%{transform:translate(0,0)} 45%{transform:translate(21px,-15px)} 50%,90%{transform:translate(42px,0)} 95%{transform:translate(21px,-15px)} 100%{transform:translate(0,0)} }
@keyframes swingk { 0%,100%{transform:rotate(-13deg)} 50%{transform:rotate(13deg)} }
@keyframes smoke { 0%{transform:translate(0,0) scale(.5);opacity:0} 15%{opacity:.75} 100%{transform:translate(22px,-62px) scale(2);opacity:0} }
@keyframes winglow { from{opacity:.55} to{opacity:1} }
@keyframes flame { from{transform:scale(1,1) rotate(-3deg)} to{transform:scale(.9,1.12) rotate(3deg)} }
@keyframes wob { 50%{transform:rotate(7deg)} }
@keyframes wing { from{transform:scaleX(1)} to{transform:scaleX(.25)} }
@keyframes flap { from{transform:scaleY(1)} to{transform:scaleY(-.6)} }
@keyframes flutter { 0%{transform:translate(180px,150px)} 20%{transform:translate(340px,110px)} 40%{transform:translate(520px,170px)} 60%{transform:translate(740px,120px)} 80%{transform:translate(900px,165px)} 100%{transform:translate(180px,150px)} }
@keyframes fly { from{transform:translate(-80px,60px)} 50%{transform:translate(800px,30px)} to{transform:translate(1700px,70px)} }
@keyframes tail { 50%{transform:rotate(-18deg)} }
@keyframes crawl { from{transform:translateX(-60px)} to{transform:translateX(1660px)} }
@keyframes stalk { to{transform:rotate(14deg)} }
@keyframes bunrun { 0%{transform:translateX(-90px)} 55%,100%{transform:translateX(1700px)} }
@keyframes bunhop { 0%,100%{transform:translateY(0) scale(1.08,.9)} 30%{transform:translateY(-4px) scale(.95,1.08)} 50%{transform:translateY(-16px)} 85%{transform:translateY(0) scale(1.08,.9)} }
@keyframes seedk { 0%{transform:translate(0,0)} 25%{transform:translate(160px,-26px)} 50%{transform:translate(320px,6px)} 75%{transform:translate(480px,-30px)} 100%{transform:translate(640px,-4px)} }
@keyframes ffloat { from{transform:translate(0,0)} 50%{transform:translate(30px,-22px)} to{transform:translate(-18px,-40px)} }
@keyframes puff { 0%{transform:scale(.4);opacity:.7} 100%{transform:translate(-6px,-8px) scale(1.6);opacity:0} }
@keyframes tagbob { 50%{transform:translateY(-4px)} }
@keyframes burst { from{transform:translate(0,0) scale(.4);opacity:1} to{transform:translate(var(--dx),var(--dy)) scale(1.3);opacity:0} }

/* Focus Overlay Sheet */
.focus-sheet {
  position: fixed; inset: 0; z-index: 100;
  display: flex; align-items: center; justify-content: center;
  padding: 16px; background: rgba(15, 23, 42, 0.7);
  backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
}
.f-box {
  width: 100%; max-width: 500px;
  background: var(--surface-solid); border: 1px solid var(--border);
  border-radius: 28px; padding: 28px; text-align: center;
  box-shadow: 0 20px 40px rgba(0,0,0,0.25);
  display: flex; flex-direction: column; gap: 16px;
}
.f-clock {
  font: 800 clamp(4.5rem, 20vw, 6.5rem)/1 var(--font-mono);
  letter-spacing: -0.04em; font-variant-numeric: tabular-nums;
  color: var(--blue); margin: 6px 0;
}

/* Modals & Toast */
.modal {
  position: fixed; inset: 0; z-index: 200;
  display: grid; place-items: center; padding: 16px;
  background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(16px);
}
.modal-box {
  width: 100%; max-width: 440px;
  background: var(--surface-solid); border: 1px solid var(--border);
  border-radius: 26px; padding: 22px;
  box-shadow: 0 16px 36px rgba(0,0,0,0.2);
}
.toast {
  position: fixed; left: 50%; bottom: 84px; transform: translate(-50%, 20px);
  z-index: 300; background: var(--text); color: var(--bg);
  padding: 10px 18px; border-radius: 999px; font-weight: 700; font-size: 0.85rem;
  box-shadow: 0 8px 24px rgba(0,0,0,0.2); opacity: 0; pointer-events: none;
  transition: opacity 0.2s, transform 0.2s;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }

/* Sticky Mobile Bottom Navigation */
.nav-tab-bar {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 90;
  background: var(--surface); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-top: 1px solid var(--border); padding: 8px 12px;
  display: flex; justify-content: space-around; max-width: 520px; margin: 0 auto;
  border-radius: 24px 24px 0 0; box-shadow: 0 -4px 20px rgba(0,0,0,0.06);
}
.nav-tab {
  background: none; border: 0; padding: 6px 12px; border-radius: 14px;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  color: var(--text-muted); font-size: 0.72rem; font-weight: 700; cursor: pointer;
}
.nav-tab.active { color: var(--blue); }
</style>
</head>
<body>
<div id="app">
  <!-- Top App Bar -->
  <header class="top-bar">
    <div class="brand-group">
      <div class="brand-icon">SQ</div>
      <div>
        <h1>Study Quest</h1>
        <p class="subline" id="subline">Grade 10 · 2nd Quarter</p>
      </div>
    </div>
    <div class="chips">
      <span class="chip flame" id="chipStreak">🔥 0 days</span>
      <span class="chip" id="chipLevel">Lv 1 Rookie</span>
    </div>
  </header>

  <!-- Hero Next Study Card -->
  <section class="glass-card" id="hero"></section>

  <!-- Today Dashboard Rings & Progress -->
  <section class="glass-card" id="todayBoard"></section>

  <!-- Bean's World Section -->
  <section class="glass-card" style="padding:16px;">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
      <h2 style="font-size:1.15rem;font-weight:800;display:flex;align-items:center;gap:6px;">🫘 Bean’s World</h2>
      <span class="chip" id="beanCount" style="font-size:0.85rem;">🧦 0</span>
    </div>
    <div class="world-wrap" id="beanHome" tabindex="0"></div>
    <p style="font-size:0.78rem;color:var(--text-muted);margin-top:8px;">
      👈 Swipe horizontally to explore. Day turns to golden sunset and starry night. Tap the cat or Bean!
    </p>
  </section>

  <!-- Weekly Activity Chart -->
  <section class="glass-card" id="weekSec">
    <h3 style="font-size:1rem;font-weight:800;margin-bottom:6px;">This Week’s Study Activity</h3>
    <div id="week"></div>
  </section>

  <!-- Subjects Grid -->
  <section class="glass-card" style="padding:18px;">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
      <h3 style="font-size:1rem;font-weight:800;">Grade 10 Subjects</h3>
      <label style="font-size:0.8rem;font-weight:600;display:flex;align-items:center;gap:6px;cursor:pointer;">
        <input type="checkbox" id="hidedone" checked> Hide finished
      </label>
    </div>
    <div id="subjects"></div>
  </section>

  <!-- Badges Showcase -->
  <section class="glass-card" style="padding:18px;">
    <h3 style="font-size:1rem;font-weight:800;margin-bottom:10px;">Badges Earned</h3>
    <div class="badges" id="badges"></div>
  </section>

  <!-- Setup & Offline Export -->
  <section class="glass-card" style="padding:18px;">
    <h3 style="font-size:1rem;font-weight:800;margin-bottom:12px;">Setup & Preferences</h3>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;" id="setupGrid">
      <div>
        <label style="font-size:0.78rem;font-weight:700;display:block;margin-bottom:4px;">Test Quarter</label>
        <select id="quarter" style="width:100%;height:40px;border-radius:12px;padding:0 8px;border:1px solid var(--border);background:var(--surface-solid);">
          <option value="1">1st Quarter</option>
          <option value="2" selected>2nd Quarter</option>
          <option value="3">3rd Quarter</option>
          <option value="4">4th Quarter</option>
        </select>
      </div>
      <div>
        <label style="font-size:0.78rem;font-weight:700;display:block;margin-bottom:4px;">Upcoming Test Date</label>
        <input id="testdate" type="date" style="width:100%;height:40px;border-radius:12px;padding:0 8px;border:1px solid var(--border);background:var(--surface-solid);">
      </div>
    </div>
    <div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;">
      <button class="btn sm" id="exportBtn">Export Backup (JSON)</button>
      <label class="btn sm" style="cursor:pointer;">Import Backup<input id="importFile" type="file" accept=".json" style="display:none;"></label>
    </div>
  </section>
</div>

<!-- Focus Timer Overlay Sheet -->
<div id="focusSheet" class="focus-sheet" hidden role="dialog" aria-modal="true">
  <div class="f-box" id="fbody"></div>
</div>

<!-- Modal Box -->
<div id="modal" class="modal" hidden role="dialog" aria-modal="true">
  <div class="modal-box" id="modalBox"></div>
</div>

<!-- Toast -->
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  'use strict';
  const STORAGE_KEY = 'grade10-test2-page-tracker-v1';
  const XP_PAGE = 10, XP_SESSION = 25, XP_SUBJECT = 100, XP_BADGE = 50, XP_QUIZ = 5, XP_QUIZ_RIGHT = 2;
  const DEFAULT_REWARDS = '🍪 A snack, 📺 One short video, 🎮 One game round, 🚶 A quick walk';

  const subjects = [
    {name:'Amharic', emoji:'📝', hue:335, ranges:[[1,30],[48,84],[85,111],[126,151]]},
    {name:'Math', emoji:'📐', hue:225, ranges:[[1,67],[81,170],[171,239],[255,364]]},
    {name:'Physics', emoji:'⚡', hue:265, ranges:[[1,45],[59,116],[117,175],[190,244]]},
    {name:'Chemistry', emoji:'🧪', hue:165, ranges:[[1,46],[60,105],[106,164],[197,296]]},
    {name:'Biology', emoji:'🧬', hue:130, ranges:[[1,40],[51,95],[96,136],[143,174]]},
    {name:'Citizenship', emoji:'🤝', hue:22, ranges:[[1,53],[64,113],[114,144],[154,211]]},
    {name:'Geography', emoji:'🌍', hue:190, ranges:[[1,37],[55,100],[101,136],[151,195]]},
    {name:'Integrated English', emoji:'📖', hue:300, ranges:[[1,33],[34,65],[48,86],[99,229]]},
    {name:'Computer Education', emoji:'💻', hue:205, ranges:[[1,45],[62,101],[102,160],[178,224]]},
    {name:'Economics', emoji:'📈', hue:42, ranges:[[1,28],[49,87],[88,113],[134,184]]},
    {name:'History', emoji:'🏺', hue:6, ranges:[[1,37],[44,110],[111,163],[170,228]]},
    {name:'Afaan Oromoo', emoji:'💬', hue:80, ranges:[[1,15],[25,47],[48,70],[82,102]]}
  ];

  const MODES = {
    sprint: {label:'Just 10 minutes', work:10},
    pomodoro: {label:'Pomodoro', work:25, brk:5},
    hardest: {label:'Hardest subject first', work:10}
  };

  const BADGES = [
    {id:'first', e:'🌱', n:'First step', d:'Log your first page', t:s=>s.pages>=1},
    {id:'p50', e:'📘', n:'First 50 pages', d:'Study 50 pages in total', t:s=>s.pages>=50},
    {id:'p200', e:'📚', n:'200 pages', d:'Study 200 pages in total', t:s=>s.pages>=200},
    {id:'p500', e:'🏔️', n:'500 pages', d:'Study 500 pages in total', t:s=>s.pages>=500},
    {id:'fin1', e:'🏁', n:'Subject finished', d:'Finish every page of one subject', t:s=>s.fin>=1},
    {id:'fin3', e:'🏆', n:'Triple finish', d:'Finish three subjects', t:s=>s.fin>=3},
    {id:'str3', e:'🔥', n:'3 days in a row', d:'Study three days running', t:s=>s.streak>=3},
    {id:'str7', e:'🚀', n:'One-week streak', d:'Study seven days running', t:s=>s.streak>=7},
    {id:'early', e:'🌅', n:'Early bird', d:'Study before 8 AM', t:s=>s.early},
    {id:'focus1', e:'⏱️', n:'First focus round', d:'Finish a full timer', t:s=>s.sessions>=1},
    {id:'pomo3', e:'🍅', n:'Pomodoro pro', d:'Finish three 25-minute rounds', t:s=>s.pomos>=3},
    {id:'half', e:'🌗', n:'Halfway there', d:'Cover 50% of the quarter', t:s=>s.pct>=50},
    {id:'ready', e:'🎓', n:'Test ready', d:'Cover 100% of the quarter', t:s=>s.pct>=100}
  ];

  const RANKS = [[1,'Rookie'],[3,'Learner'],[5,'Scholar'],[8,'Master'],[10,'Top of the Class']];
  const DECOR = [
    {id:'plant', n:'Potted Fern', c:3, x:640, h:76}, {id:'candle', n:'Amber Candle', c:4, x:780, h:72},
    {id:'chair', n:'Cozy Armchair', c:6, x:920, h:62}, {id:'frame', n:'Nature Canvas', c:8, x:1070, h:90},
    {id:'rug', n:'Yarn Basket', c:10, x:1215, h:56}, {id:'books', n:'Oak Bookshelf', c:12, x:1375, h:98}
  ];

  const $ = id => document.getElementById(id);
  const byName = n => subjects.find(s => s.name === n);
  const pad = n => String(n).padStart(2, '0');
  const dayKey = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  const todayKey = () => dayKey(new Date());
  const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
  const ord = q => ['1st','2nd','3rd','4th'][q - 1] || q + 'th';
  const fmt = ms => { const t = Math.max(0, Math.ceil(ms / 1000)); return pad(Math.floor(t / 60)) + ':' + pad(t % 60); };

  function defaultState() {
    return {quarter:2, date:'', progress:{}, credited:{}, xp:0, totalPages:0, days:{}, badges:{}, bestStreak:0,
      sessions:0, pomodoros:0, early:false, hideDone:true, hardest:'', rewards:DEFAULT_REWARDS, sound:true, timer:null,
      offsets:{}, quiz:[], quizBlocklist:[], socks:0, decor:{}};
  }

  let state = defaultState();
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) state = Object.assign(defaultState(), JSON.parse(saved));
  } catch (e) {}

  const currentQuarter = () => Number($('quarter').value);
  const rangeFor = s => s.ranges[currentQuarter() - 1];
  const keyFor = name => currentQuarter() + '|' + name;
  const countFor = r => r[1] - r[0] + 1;
  function saveState() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {} }

  function studiedCount(s) {
    const r = rangeFor(s), p = state.progress[keyFor(s.name)];
    if (p == null) return 0;
    return Math.max(0, Math.min(countFor(r), Number(p) - r[0] + 1));
  }
  function lastEffective(s) {
    const r = rangeFor(s), p = state.progress[keyFor(s.name)];
    return p == null ? r[0] - 1 : Math.max(r[0] - 1, Math.min(r[1], Number(p)));
  }
  const isFinished = s => studiedCount(s) >= countFor(rangeFor(s));

  function overall() {
    let total = 0, covered = 0;
    subjects.forEach(s => { total += countFor(rangeFor(s)); covered += studiedCount(s); });
    return {total, covered, remaining:total - covered, pct:total ? Math.round(covered / total * 100) : 0};
  }

  function smartList() {
    return subjects.map(s => { const c = countFor(rangeFor(s)), st = studiedCount(s); return {s, pct:st / c, left:c - st}; })
      .filter(x => x.left > 0).sort((a, b) => a.pct - b.pct || b.left - a.left).map(x => x.s);
  }

  const xpFor = n => 50 * n * (n - 1);
  function levelOf(xp) { let n = 1; while (xp >= xpFor(n + 1)) n++; return n; }
  function rankOf(l) { let r = RANKS[0][1]; RANKS.forEach(([min, name]) => { if (l >= min) r = name; }); return r; }
  const dayData = k => state.days[k] || {p:0, q:{}, s:0, m:0};
  const studiedOn = k => { const d = state.days[k]; return !!d && (d.p > 0 || d.s > 0); };

  function streakInfo() {
    let d = new Date(); d.setHours(12, 0, 0, 0);
    const todayDone = studiedOn(dayKey(d));
    if (!todayDone) d = addDays(d, -1);
    let n = 0;
    while (studiedOn(dayKey(d))) { n++; d = addDays(d, -1); }
    return {n, todayDone};
  }

  let toastTimer;
  function toast(msg) {
    const el = $('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 3500);
  }

  /* Rendering Dashboard */
  let pickIdx = 0;
  function render() {
    const q = currentQuarter();
    const st = streakInfo();
    const lv = levelOf(state.xp);
    const o = overall();

    $('subline').textContent = `Grade 10 · ${ord(q)} Quarter`;
    $('chipStreak').textContent = `🔥 ${st.n} day${st.n === 1 ? '' : 's'}`;
    $('chipStreak').className = 'chip ' + (st.n > 0 ? 'flame' : 'cold');
    $('chipLevel').textContent = `Lv ${lv} ${rankOf(lv)}`;
    $('beanCount').textContent = `🧦 ${state.socks}`;

    // Hero
    const list = smartList();
    if (list.length) {
      const s = list[pickIdx % list.length];
      const r = rangeFor(s);
      const base = lastEffective(s);
      const a = base + 1, b = Math.min(r[1], base + 5);
      const goal = a === b ? `page ${a}` : `pages ${a} to ${b}`;
      $('hero').innerHTML = `
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
          <div style="display:flex;align-items:center;gap:10px;">
            <span style="font-size:1.8rem;">${s.emoji}</span>
            <div><h3 style="font-size:1.2rem;font-weight:800;">${s.name}</h3><span style="font-size:0.8rem;color:var(--text-muted);">${countFor(r) - studiedCount(s)} pages left</span></div>
          </div>
          <button class="btn sm" id="swapBtn">Swap 🎲</button>
        </div>
        <p style="font-size:0.92rem;margin:8px 0 14px;">Read <strong>${goal}</strong>, then Bean knits you warm socks.</p>
        <button class="go" id="goSprint">▶ Just 10 Minutes Focus</button>
      `;
      $('goSprint').onclick = () => startSession(s.name, 'sprint');
      $('swapBtn').onclick = () => { pickIdx++; render(); };
    } else {
      $('hero').innerHTML = '<div style="text-align:center;"><h2>🎓 All pages covered for this quarter!</h2></div>';
    }

    // Today Board
    const todayP = (state.days[todayKey()]?.q || {})[q] || 0;
    $('todayBoard').innerHTML = `
      <div class="dashboard-grid">
        <div>
          <div class="numline"><span class="num">${todayP}</span><span style="font-weight:700;color:var(--text-muted);">pages read today</span></div>
          <div class="strip"><i style="width:${o.pct}%"></i></div>
          <p style="font-size:0.88rem;color:var(--text-muted);"><strong>${o.pct}%</strong> overall quarter completion (${o.covered}/${o.total} pages)</p>
        </div>
        <div style="text-align:center;">
          <div style="font-size:2rem;font-weight:800;color:var(--yellow);">${state.xp}</div>
          <span style="font-size:0.75rem;font-weight:700;color:var(--text-muted);">Total XP</span>
        </div>
      </div>
    `;

    // Subjects
    $('subjects').innerHTML = subjects
      .filter(s => (state.hideDone ? !isFinished(s) : true))
      .map(s => {
        const r = rangeFor(s);
        const st = studiedCount(s);
        const pct = Math.round((st / countFor(r)) * 100);
        return `
          <div class="subj-card">
            <div class="subj-head">
              <div class="subj-title"><span>${s.emoji}</span><span>${s.name}</span></div>
              <strong>${pct}%</strong>
            </div>
            <div class="strip"><i style="width:${pct}%"></i></div>
            <div class="subj-acts">
              <span style="font-size:0.78rem;color:var(--text-muted);">${st} of ${countFor(r)} studied (p. ${r[0]}–${r[1]})</span>
              <div style="display:flex;gap:6px;">
                <button class="btn sm" onclick="window.quickAdd('${s.name}', 5)">+5</button>
                <button class="btn sm" onclick="window.quickAdd('${s.name}', 10)">+10</button>
              </div>
            </div>
          </div>
        `;
      }).join('');

    // Badges
    $('badges').innerHTML = BADGES.map(b => {
      const on = !!state.badges[b.id];
      return `<div class="badge ${on ? 'on' : ''}"><span class="e">${b.e}</span><b>${b.n}</b><span class="d">${on ? 'Earned' : b.d}</span></div>`;
    }).join('');

    saveState();
  }

  // Quick Add helper
  window.quickAdd = (name, n) => {
    const s = byName(name);
    if (!s) return;
    const r = rangeFor(s);
    const base = lastEffective(s);
    const target = Math.min(r[1], base + n);
    state.progress[keyFor(name)] = target;
    const gained = Math.min(n, target - base);
    const todayK = todayKey();
    state.days[todayK] = state.days[todayK] || {p:0, q:{}, s:0, m:0};
    state.days[todayK].p += gained;
    state.days[todayK].q[currentQuarter()] = (state.days[todayK].q[currentQuarter()] || 0) + gained;
    state.xp += gained * XP_PAGE;
    state.totalPages += gained;
    toast(`Added ${gained} pages to ${name}! +${gained * XP_PAGE} XP`);
    render();
  };

  // Focus Timer
  function startSession(name, mode) {
    const s = byName(name);
    const r = rangeFor(s);
    const base = lastEffective(s);
    state.timer = {
      mode, phase:'work', stage:'running', subject:name,
      total: MODES[mode].work * 60000,
      endsAt: Date.now() + MODES[mode].work * 60000,
      goalA: base + 1, goalB: Math.min(r[1], base + 5)
    };
    renderFocus();
  }

  function renderFocus() {
    const t = state.timer;
    const f = $('focusSheet');
    if (!t) { f.hidden = true; return; }
    f.hidden = false;
    const left = Math.max(0, t.endsAt - Date.now());
    $('fbody').innerHTML = `
      <div style="font-weight:700;font-size:0.9rem;color:var(--text-muted);">${t.subject} Focus</div>
      <div class="bean-wrap">
        <svg class="bean knit" viewBox="-62 -118 130 132">
          <g class="bf m-happy p-knit knitting">
            <ellipse cx="0" cy="2" rx="28" ry="5" fill="rgba(0,0,0,.18)"/>
            <g class="bf-all">
              <g class="bf-body"><path d="M-31 -40 C-35 -80 -8 -94 8 -90 C32 -86 38 -60 32 -38 C28 -16 12 -8 -3 -8 C-21 -8 -29 -22 -31 -40Z" fill="#eaae70" stroke="#0f172a" stroke-width="3"/></g>
              <g class="pk">
                <line class="nl" x1="-24" y1="-26" x2="4" y2="-6" stroke="#0f172a" stroke-width="3"/>
                <line class="nr" x1="28" y1="-26" x2="0" y2="-6" stroke="#0f172a" stroke-width="3"/>
                <circle cx="-24" cy="-26" r="6" fill="#eaae70" stroke="#0f172a" stroke-width="2"/>
                <circle cx="28" cy="-26" r="6" fill="#eaae70" stroke="#0f172a" stroke-width="2"/>
              </g>
            </g>
          </g>
        </svg>
        <span style="font-size:0.82rem;font-weight:700;">Bean is knitting your socks!</span>
      </div>
      <div class="f-clock">${fmt(left)}</div>
      <button class="go" id="fDoneBtn">Finish Early</button>
      <button class="btn sm" id="fCancelBtn" style="margin-top:6px;">Cancel Session</button>
    `;
    $('fDoneBtn').onclick = () => {
      state.socks += 3;
      state.xp += XP_SESSION;
      state.sessions += 1;
      state.timer = null;
      toast(`Round complete! +${XP_SESSION} XP · +3 🧦`);
      renderFocus();
      render();
    };
    $('fCancelBtn').onclick = () => {
      state.timer = null;
      renderFocus();
    };
  }

  // Bean's World SVG
  function initWorld() {
    $('beanHome').innerHTML = `
      <svg class="w-svg" viewBox="0 0 1600 300">
        <rect width="1600" height="300" fill="#7cc8ff"/>
        <rect class="tint" width="1600" height="300" fill="#ff9a5b"/>
        <circle cx="110" cy="66" r="30" fill="#ffd93d"/>
        <path d="M0 240 Q400 210 800 240 T1600 240 V300 H0Z" fill="#4f9f45"/>
        <path d="M0 262 Q400 254 800 262 T1600 262" stroke="#ecd9a0" stroke-width="16" fill="none"/>
        <g class="cat" transform="translate(205 258)">
          <ellipse cx="0" cy="-12" rx="24" ry="13" fill="#f3a65a"/>
          <text x="-8" y="-38" font-size="14" fill="#fff">z</text>
        </g>
        <g id="wBean" transform="translate(260 258)">
          <ellipse cx="0" cy="2" rx="24" ry="5" fill="rgba(0,0,0,0.2)"/>
          <path d="M-25 -35 C-28 -70 -6 -80 6 -76 C26 -72 30 -50 26 -32 C22 -14 10 -6 -2 -6 C-17 -6 -23 -18 -25 -35Z" fill="#eaae70" stroke="#0f172a" stroke-width="2.5"/>
        </g>
      </svg>
    `;
  }

  // Startup
  $('quarter').addEventListener('change', () => { state.quarter = currentQuarter(); render(); });
  $('hidedone').addEventListener('change', e => { state.hideDone = e.target.checked; render(); });
  $('exportBtn').addEventListener('click', () => {
    const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = `grade10-progress-${todayKey()}.json`; a.click();
  });
  initWorld();
  render();
})();
</script>
</body>
</html>
